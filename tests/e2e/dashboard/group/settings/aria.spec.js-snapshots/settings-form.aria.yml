- textbox "Fiscal Sponsor Stripe Account":
  - /placeholder: acct_...
- paragraph: Enter the Standard-like Stripe connected account owned by the named fiscal sponsor that sells tickets and handles tax, invoices, refunds, disputes, and negative balances. Leave both fiscal sponsor fields blank to keep the group on free events only.
- text: External payments
