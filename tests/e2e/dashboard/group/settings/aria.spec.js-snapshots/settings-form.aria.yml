- text: UTM tracking
- paragraph: Optional attribution of event page views to the UTM parameters of the links that bring visitors.
- paragraph:
  - text: UTM tracking is opt-in. Event page views are only attributed when the link's
  - code: utm_source
  - text: is one of the sources or its
  - code: utm_campaign
  - text: is one of the campaigns defined below, so define at least one source or campaign to start tracking.
- paragraph: 'Every UTM parameter in the link must be accepted: views whose source, campaign, or medium is not listed here are still counted, but without attribution. Links may omit the medium.'
- group "Sources":
  - text: ''
  - textbox "Source 1":
    - /placeholder: newsletter
  - button "Remove item" [disabled]
