- text: Additional Information
- paragraph: Optional event settings and external links.
- checkbox "Enable Waitlist"
- text: Enable Waitlist
- paragraph: Allow full events, including paid ticket events, to add people to a waiting list instead of rejecting them. Capacity is the total of ticket seats. Invitation approval and the waitlist cannot be enabled together.
- checkbox "Require Invitation Approval"
- text: Require Invitation Approval
- paragraph: Let people request organizer approval before attending or claiming a ticket. Paid ticket events can use invitation approval. Invitation approval and the waitlist cannot be enabled together. Accept pending requests and reissue expired offers while the event is still active, including outside the public registration window.
- checkbox "Test Event"
- text: Test Event
- paragraph: Exclude this event from discovery, stats, and broadcast notifications.
