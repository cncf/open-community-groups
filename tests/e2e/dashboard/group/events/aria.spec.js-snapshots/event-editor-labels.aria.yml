- text: Labels
- paragraph: Categorize sessions and Call for Speakers submissions.
- text: Labels are shared by sessions and Call for Speakers submissions. For example, you can use them to organize sessions by track, topic, or theme. Renaming a label updates it everywhere it is used. To delete a label, use its trash button. Label
