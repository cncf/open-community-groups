- textbox "Registration Closes"
- paragraph: Must be after the open date. Leave blank with an open date to close at event start. Leave both fields blank for no window.
- text: A registration window limits attendee self-registration, ticket checkout, new invitation requests, waitlist promotion, and registration-question answers. Organizers can still accept pending invitation requests and reissue expired approval offers outside the window. Rejecting requests and inviting attendees manually still work; those invitees can complete required registration questions.
