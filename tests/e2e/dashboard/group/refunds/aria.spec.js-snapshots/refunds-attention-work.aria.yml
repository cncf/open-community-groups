- table "Financial work needing attention":
  - caption: Financial work needs attention Automatic retries are exhausted. Retry the operation or record work completed directly in Stripe.
  - rowgroup:
    - row "Attendee Event Amount Status Actions":
      - columnheader "Attendee"
      - columnheader "Event"
      - columnheader "Amount"
      - columnheader "Status"
      - columnheader "Actions"
  - rowgroup:
    - 'row /E2E Pending Two e2e-pending-2@example\.com E2E ARIA event \$\d+\.\d+ Credit note Needs retry: view last failure for Credit note/':
      - cell "E2E Pending Two e2e-pending-2@example.com"
      - cell "E2E ARIA event"
      - cell /\$\d+\.\d+ Credit note/
      - 'cell "Needs retry: view last failure for Credit note"':
        - 'button "Needs retry: view last failure for Credit note"'
      - cell:
        - group