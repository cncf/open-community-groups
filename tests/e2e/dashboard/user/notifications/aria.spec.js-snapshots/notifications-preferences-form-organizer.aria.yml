- group "Events and groups":
  - text: ""
  - checkbox "New events" [checked]
  - text: New events
  - paragraph: When a group you belong to or help organize publishes a new event or event series, including events it co-hosts with other groups.
  - checkbox "Group announcements" [checked]
  - text: Group announcements
  - paragraph: Messages organizers send to members of a group you belong to or help organize.
  - checkbox "Event reminders" [checked]
  - text: Event reminders
  - paragraph: /A reminder about \d+ hours before an event you're attending or speaking at, if the organizers turned reminders on\./
  - checkbox "Event surveys" [checked]
  - text: Event surveys
  - paragraph: When the organizers of an event you're registered for open a feedback survey after it ends.
  - checkbox "Messages from event organizers" [checked]
  - text: Messages from event organizers
  - paragraph: Updates organizers send to attendees of events you're registered for.
  - checkbox "Badges" [checked]
  - text: Badges
  - paragraph: When a group awards you a badge or revokes one. This only controls the email; awards and revocations still take effect in your dashboard.
- group "Group organizing":
  - text: ""
  - checkbox "Group inbox" [checked]
  - text: Group inbox
  - paragraph: When someone writes to a group you help manage. Only sent if your role includes inbox access.
  - checkbox "Co-hosting updates" [checked]
  - text: Co-hosting updates
  - paragraph: When a group responds to your group's co-hosting invitation, or your group's co-hosting of an event ends. Sent to group admins.
  - checkbox "Attendee activity" [checked]
  - text: Attendee activity
  - paragraph: When an attendee declines a ticket offer you assigned.
- button "Save"