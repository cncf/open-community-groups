# Tern configuration for the E2E database.
#
# Values come from the `OCG_E2E_DB_*` contract exported by the `justfile`
# (tern renders this file as a Go template, so the variables must be set).
[database]
host = {{ env "OCG_E2E_DB_HOST" }}
port = {{ env "OCG_E2E_DB_PORT" }}
database = {{ env "OCG_E2E_DB_NAME" }}
user = {{ env "OCG_E2E_DB_USER" }}
password = {{ env "OCG_E2E_DB_PASSWORD" }}
