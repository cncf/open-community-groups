name: CI

on:
  pull_request:
    branches:
      - main

# Cancel stale runs when a PR receives new commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with e2e.yml and cache.yml so Rust caches share keys.
  RUST_TOOLCHAIN: 1.98.0

jobs:
  changes:
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
      database_contracts: ${{ steps.filter.outputs.database_contracts }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      javascript: ${{ steps.filter.outputs.javascript }}
      markdown: ${{ steps.filter.outputs.markdown }}
      server: ${{ steps.filter.outputs.server }}
      templates: ${{ steps.filter.outputs.templates }}
    steps:
      - name: Determine changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            database:
              - '.github/workflows/ci.yml'
              - '.github/workflows/tern.conf'
              - 'database/**'
            database_contracts:
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'database/**'
              - 'justfile'
              - 'ocg-server/Cargo.toml'
              - 'ocg-server/src/db.rs'
              - 'ocg-server/src/db/**'
              - 'ocg-server/src/templates.rs'
              - 'ocg-server/src/templates/**'
              - 'ocg-server/src/types.rs'
              - 'ocg-server/src/types/**'
            dependencies:
              - '.github/workflows/ci.yml'
              - '**/Cargo.lock'
              - '**/Cargo.toml'
              - '.cargo/audit.toml'
            javascript:
              - '.github/workflows/ci.yml'
              - 'tests/unit/**'
              - 'ocg-server/static/js/**'
              - 'ocg-server/static/js/.prettierrc.yaml'
              - 'tests/unit/package-lock.json'
            markdown:
              - '.github/workflows/ci.yml'
              - '**/*.md'
            server:
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '.rustfmt.toml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'ocg-common/**'
              - 'ocg-redirector/**'
              - 'ocg-server/**'
            templates:
              - '.github/workflows/ci.yml'
              - 'ocg-server/templates/**'
              - 'ocg-server/templates/.djlintrc'

  audit-dependencies:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    permissions:
      contents: read
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run cargo audit
        run: cargo audit

  check-js-files-format:
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run prettier
        uses: creyD/prettier_action@v4.6
        with:
          dry: true
          prettier_version: 3.9.4
          prettier_options: --check ocg-server/static/js/**/*.js --config ocg-server/static/js/.prettierrc.yaml

  lint-server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on:
      labels: ubuntu-latest-16-cores
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: Install Tailwind CSS
        uses: ./.github/actions/install-tailwind
      - name: Run rustfmt
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- --deny warnings

  lint-markdown-files:
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          globs: 'docs/**/*.md'

  lint-templates:
    needs: changes
    if: needs.changes.outputs.templates == 'true'
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install djlint
        run: pip install djlint==1.45.2 click==8.4.2
      - name: Run djlint
        run: |
          djlint \
            --check \
            --configuration ocg-server/templates/.djlintrc \
            ocg-server/templates

  test-server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on:
      labels: ubuntu-latest-16-cores
    env:
      # Keep in sync with test-database-contracts and cache.yml (part of the cache key).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Install Tailwind CSS
        uses: ./.github/actions/install-tailwind
      - name: Run tests
        run: cargo test

  test-database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container: ghcr.io/cncf/open-community-groups/db-tests
    services:
      postgres:
        image: ghcr.io/cncf/open-community-groups/postgres-db-tests
        env:
          POSTGRES_USER: tests
          POSTGRES_PASSWORD: tests
          POSTGRES_DB: tests
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run database lint
        run: sh database/scripts/lint.sh
      - name: Apply database migrations
        working-directory: ./database/migrations
        run: TERN_CONF=../../../.github/workflows/tern.conf PGPORT=${{ job.services.postgres.ports[5432] }} ./migrate.sh
      - name: Install pgtap database extension
        run: PGPASSWORD=tests psql -h postgres -p ${{ job.services.postgres.ports[5432] }} -U tests tests -c 'create extension pgtap;'
      - name: Install database test fixtures
        working-directory: ./database/tests
        run: for file in fixtures/*.sql; do PGPASSWORD=tests psql -h postgres -p ${{ job.services.postgres.ports[5432] }} -U tests tests -q -v ON_ERROR_STOP=1 -f "$file" || exit 1; done
      - name: Run database tests
        working-directory: ./database/tests
        run: PGPASSWORD=tests pg_prove --host postgres --dbname tests --username tests --jobs 4 --verbose $(find schema functions -type f -name '*.sql' | sort)
      - name: Check database test seed keys
        run: PGPASSWORD=tests sh database/scripts/check-seed-keys.sh -h postgres -p ${{ job.services.postgres.ports[5432] }} -U tests tests

  test-database-contracts:
    needs: changes
    if: needs.changes.outputs.database_contracts == 'true'
    runs-on:
      labels: ubuntu-latest-16-cores
    permissions:
      contents: read
      packages: read
    env:
      # Keep in sync with test-server and cache.yml (part of the cache key).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    services:
      postgres:
        image: ghcr.io/cncf/open-community-groups/postgres-db-tests
        env:
          POSTGRES_USER: tests
          POSTGRES_PASSWORD: tests
          POSTGRES_DB: tests
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install Tailwind CSS
        uses: ./.github/actions/install-tailwind
      - name: Install tern
        uses: ./.github/actions/install-tern
      - name: Create contract test tern config
        run: |
          mkdir -p /tmp/ocg
          cat >/tmp/ocg/tern-tests-contract.conf <<EOF
          [database]
          host = 127.0.0.1
          port = ${{ job.services.postgres.ports[5432] }}
          database = ocg_tests_contract
          user = tests
          password = tests
          EOF
      - name: Run database contract tests
        env:
          OCG_CONFIG: /tmp/ocg
          OCG_DB_HOST: 127.0.0.1
          OCG_DB_PORT: ${{ job.services.postgres.ports[5432] }}
          OCG_DB_PASSWORD: tests
          OCG_DB_USER: tests
          OCG_PG_BIN: /usr/bin
        run: just db-contract-tests

  test-frontend:
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/unit/package-lock.json
      - name: Install frontend unit test dependencies
        working-directory: tests/unit
        run: npm ci
      - name: Install Playwright browser for frontend unit tests
        working-directory: tests/unit
        run: npx playwright install --with-deps chromium
      - name: Run frontend unit tests
        working-directory: tests/unit
        run: npm test
