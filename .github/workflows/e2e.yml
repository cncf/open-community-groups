name: E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel stale runs when a PR receives new commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with ci.yml and cache.yml so Rust caches share keys.
  RUST_TOOLCHAIN: 1.98.0

jobs:
  changes:
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e || steps.manual.outputs.e2e }}
    steps:
      - name: Determine changed paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            e2e:
              - '.github/actions/**'
              - '.github/workflows/e2e.yml'
              - '.github/workflows/tern.conf'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'database/**'
              - 'docs/**'
              - 'ocg-common/**'
              - 'ocg-server/**'
              - 'tests/e2e/**'
      - name: Mark manual run as e2e-relevant
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: echo "e2e=true" >> "$GITHUB_OUTPUT"

  build-server:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true'
    runs-on:
      labels: ubuntu-latest-16-cores
    permissions:
      contents: read
    env:
      # Debuginfo is not needed by the e2e suite; skipping it speeds up the build and shrinks the
      # artifact. Keep in sync with cache.yml (part of the cache key).
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-server

      - name: Install Tailwind CSS
        uses: ./.github/actions/install-tailwind

      - name: Build e2e server binary
        run: cargo build --bin ocg-server

      - name: Upload e2e server binary
        uses: actions/upload-artifact@v4
        with:
          name: ocg-server-e2e
          # Debug builds do not embed static assets (rust-embed reads dist/static from disk at
          # runtime), so ship the generated assets together with the binary.
          path: |
            target/debug/ocg-server
            ocg-server/dist/static
          retention-days: 1
          if-no-files-found: error

  e2e-tests:
    name: ${{ matrix.suite }}
    needs:
      - changes
      - build-server
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true'
    runs-on:
      labels: ubuntu-latest-16-cores
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Smoke chromium
            browsers: chromium
            command: npx playwright test --config playwright.config.js --project=chromium-smoke
            artifact_name: playwright-artifacts-smoke-chromium
          - suite: Smoke firefox
            browsers: firefox
            command: npx playwright test --config playwright.config.js --project=firefox-smoke
            artifact_name: playwright-artifacts-smoke-firefox
          - suite: Smoke webkit
            browsers: webkit
            command: npx playwright test --config playwright.config.js --project=webkit-smoke
            artifact_name: playwright-artifacts-smoke-webkit
          - suite: Functional 1/6
            browsers: chromium
            command: npx playwright test --config playwright.config.js --project=chromium-deep --project=chromium-mobile-deep --grep-invert @visual --shard=1/6
            artifact_name: playwright-artifacts-functional-1
          - suite: Functional 2/6
            browsers: chromium
            command: npx playwright test --config playwright.config.js --project=chromium-deep --project=chromium-mobile-deep --grep-invert @visual --shard=2/6
            artifact_name: playwright-artifacts-functional-2
          - suite: Functional 3/6
            browsers: chromium
            command: npx playwright test --config playwright.config.js --project=chromium-deep --project=chromium-mobile-deep --grep-invert @visual --shard=3/6
            artifact_name: playwright-artifacts-functional-3
          - suite: Functional 4/6
            browsers: chromium
            command: npx playwright test --config playwright.config.js --project=chromium-deep --project=chromium-mobile-deep --grep-invert @visual --shard=4/6
            artifact_name: playwright-artifacts-functional-4
          - suite: Functional 5/6
            browsers: chromium
            command: npx playwright test --config playwright.config.js --project=chromium-deep --project=chromium-mobile-deep --grep-invert @visual --shard=5/6
            artifact_name: playwright-artifacts-functional-5
          - suite: Functional 6/6
            browsers: chromium
            command: npx playwright test --config playwright.config.js --project=chromium-deep --project=chromium-mobile-deep --grep-invert @visual --shard=6/6
            artifact_name: playwright-artifacts-functional-6
          - suite: Visual
            browsers: chromium
            command: npx playwright test --config playwright.config.js --grep @visual --project=chromium-deep --project=chromium-mobile-deep
            artifact_name: playwright-artifacts-visual
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ocg_tests_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ocg_tests_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OCG_DB_HOST: 127.0.0.1
      OCG_DB_NAME_TESTS_E2E: ocg_tests_e2e
      OCG_DB_PASSWORD: postgres
      OCG_E2E_BASE_URL: http://127.0.0.1:9001
      OCG_E2E_MEETINGS_ENABLED: "true"
      OCG_E2E_PAYMENTS_ENABLED: "true"
      OCG_PG_BIN: /usr/bin
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Node.js dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Restore Playwright browsers cache
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Keep the key and install flags in sync with cache.yml, which warms this cache on main.
          key: ${{ runner.os }}-playwright-${{ matrix.browsers }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e
        # Headless chromium projects only need the headless shell build.
        run: npx playwright install --with-deps ${{ matrix.browsers == 'chromium' && '--only-shell' || '' }} ${{ matrix.browsers }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: tests/e2e
        run: npx playwright install-deps ${{ matrix.browsers }}

      - name: Install tern
        uses: ./.github/actions/install-tern

      - name: Create e2e tern config
        run: |
          cat <<EOF >/tmp/ocg-tern-e2e.conf
          [database]
          host = 127.0.0.1
          port = 5432
          database = ocg_tests_e2e
          user = postgres
          password = postgres
          EOF

      - name: Recreate and migrate e2e database
        working-directory: database/migrations
        run: |
          dropdb -h 127.0.0.1 -p 5432 -U postgres --if-exists --force ocg_tests_e2e
          createdb -h 127.0.0.1 -p 5432 -U postgres ocg_tests_e2e
          psql -h 127.0.0.1 -p 5432 -U postgres ocg_tests_e2e -c "CREATE EXTENSION IF NOT EXISTS pgcrypto"
          psql -h 127.0.0.1 -p 5432 -U postgres ocg_tests_e2e -c "CREATE EXTENSION IF NOT EXISTS postgis"
          TERN_CONF=/tmp/ocg-tern-e2e.conf ./migrate.sh

      - name: Load e2e seed data
        run: |
          psql -h 127.0.0.1 -p 5432 -U postgres ocg_tests_e2e -f database/tests/data/e2e.sql
          psql -h 127.0.0.1 -p 5432 -U postgres ocg_tests_e2e -c "update \"user\" set password = '\$argon2id\$v=19\$m=19456,t=2,p=1\$q55jlxUx8bffhFM3xN36ZA\$te6OiWkZ/q35lpSEAZbd/A3iJyCByxbive9F61sTp7g' where username like 'e2e-%'"

      - name: Create e2e server config
        run: |
          cat <<EOF >/tmp/ocg-e2e.yml
          db:
            host: 127.0.0.1
            port: 5432
            dbname: ocg_tests_e2e
            user: postgres
            password: "postgres"
          email:
            from_address: noreply@test.com
            from_name: Test
            smtp:
              host: localhost
              port: 1025
              username: ""
              password: ""
          images:
            provider: db
          external_payments:
            allowed_countries:
              - US
            default_payment_window_hours: 72
            max_payment_window_hours: 336
          payments:
            provider: stripe
            mode: test
            connected_webhook_secret: whsec_connect_e2e
            secret_key: sk_test_e2e
            ticket_tax_api_version: 2026-07-29.preview
            webhook_secret: whsec_e2e
          meetings:
            zoom:
              account_id: account-id
              client_id: client-id
              client_secret: client-secret
              enabled: true
              host_pool_users:
                - host@example.com
              max_participants: 100
              max_simultaneous_meetings_per_host: 1
              webhook_secret_token: whsec_zoom_e2e
          server:
            addr: 127.0.0.1:9001
            badges:
              signing_key:
                key_id: e2e-key
                private_jwk:
                  crv: Ed25519
                  d: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
                  kty: OKP
                  x: 6kpsY-KcUgq-9VB7Ey7F-ZVHdq6-vnuSQh7qaRRG0iw
              verification_keys: []
            base_url: http://127.0.0.1:9001
            cookie:
              secure: false
            allow_image_hotlinking: false
            login:
              email: true
              github: false
              linuxfoundation: false
            oauth2: {}
            oidc: {}
          EOF

      - name: Download e2e server binary
        uses: actions/download-artifact@v4
        with:
          name: ocg-server-e2e
          # The artifact root is the repository root; restores target/debug/ocg-server and
          # ocg-server/dist/static in place.
          path: .

      - name: Verify e2e server artifact
        run: |
          test -x ./target/debug/ocg-server || chmod +x ./target/debug/ocg-server
          ls ocg-server/dist/static/css/*.css >/dev/null

      - name: Start server and wait for it to be ready
        uses: JarvusInnovations/background-action@v1
        with:
          run: ./target/debug/ocg-server -c /tmp/ocg-e2e.yml &
          wait-on: http://127.0.0.1:9001
          tail: true
          log-output: "stdout,stderr"
          log-output-if: true

      - name: Run Playwright ${{ matrix.suite }} suite
        working-directory: tests/e2e
        run: ${{ matrix.command }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
