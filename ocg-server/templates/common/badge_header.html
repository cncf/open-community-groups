{# Public badge pages header -#}
<header class="border-b border-stone-200 bg-surface" role="banner">
  <nav class="mx-auto flex h-20 max-w-5xl items-center justify-center px-4 lg:px-8 phone:h-16"
       aria-label="Badge navigation">
    <a href="/"
       class="inline-flex items-center"
       aria-label="Go to {{ site_settings.title }} homepage">
      {% if let Some(url) = &site_settings.header_logo_url -%}
        {% if let Some(dark_url) = &site_settings.header_logo_dark_url -%}
          <span class="relative" data-site-logo="light">
            <img class="h-10 w-auto max-w-44 sm:h-[42px] sm:max-w-52"
                 src="{{ url }}"
                 alt="{{ site_settings.title }} logo"
                 height="42">
          </span>
          <span class="relative" data-site-logo="dark">
            <img class="h-10 w-auto max-w-44 sm:h-[42px] sm:max-w-52"
                 src="{{ dark_url }}"
                 alt="{{ site_settings.title }} logo"
                 height="42"
                 loading="lazy">
          </span>
        {% else -%}
          <span class="relative plate" data-site-logo="plated">
            <img class="h-10 w-auto max-w-44 sm:h-[42px] sm:max-w-52"
                 src="{{ url }}"
                 alt="{{ site_settings.title }} logo"
                 height="42">
          </span>
        {% endif -%}
      {% else -%}
        <span class="text-lg font-semibold text-stone-900">{{ site_settings.title }}</span>
      {% endif -%}
    </a>
  </nav>
</header>
{# End public badge pages header -#}
