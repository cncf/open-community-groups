{# Inbox action done notice -#}
<section id="inbox-conversation" class="min-w-0">
  <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-900"
       role="status"
       data-inbox-action-done>
    <span>{{ message }}</span>
    <a href="{{ reload_url }}"
       hx-boost="false"
       class="ms-1 font-semibold underline underline-offset-2 hover:text-primary-700">Reload the conversation</a>
  </div>
</section>
{# End inbox action done notice -#}
