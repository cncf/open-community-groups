{% import "macros/dashboard.html" as dashboard -%}

<div id="group-check-in-scanner-modal"
     class="fixed inset-0 z-[1000] hidden items-center justify-center p-3 sm:p-6 flex"
     data-restorable-modal
     role="dialog"
     aria-modal="true"
     aria-hidden="true"
     aria-labelledby="group-check-in-scanner-title"
     aria-describedby="group-check-in-scanner-status">
  <button type="button"
          class="modal-overlay absolute inset-0 bg-stone-950/60"
          data-group-check-in-close
          tabindex="-1"
          aria-label="Close QR scanner"></button>
  <div class="relative z-10 flex h-[calc(100dvh-1.5rem)] w-full max-w-full flex-col overflow-hidden rounded-xl bg-white shadow-xl sm:h-auto sm:max-h-[calc(100dvh-3rem)] sm:max-w-2xl sheet-panel phone:h-[calc(100dvh-4rem)]">
    <div class="flex shrink-0 items-center justify-between gap-4 border-b border-stone-200 px-5 py-4 sm:px-6 sm:py-5 sheet-head sheet-grab phone:py-0">
      <h3 id="group-check-in-scanner-title"
          class="text-xl font-semibold text-stone-900 phone:min-w-0 phone:truncate">Scan Attendee Codes</h3>
      {{ dashboard::modal_close_button(attrs = "data-group-check-in-close") -}}
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto p-4 md:p-6 phone:max-sm:flex phone:max-sm:flex-col phone:max-sm:p-0"
         data-group-check-in-body>
      <div class="w-full overflow-hidden rounded-xl border border-stone-200 bg-white phone:max-sm:flex phone:max-sm:shrink-0 phone:max-sm:basis-auto phone:max-sm:flex-1 phone:max-sm:flex-col phone:max-sm:rounded-none phone:max-sm:border-0">
        <div class="p-4 sm:p-5 phone:max-sm:py-2">
          <h4 id="group-check-in-event-name"
              class="text-lg font-semibold text-stone-900 phone:max-sm:line-clamp-1"></h4>
          <dl class="mt-2 space-y-2 text-sm text-stone-600 phone:max-sm:mt-1 phone:max-sm:flex phone:max-sm:gap-3 phone:max-sm:space-y-0">
            <div class="flex min-w-0 items-center gap-2 phone:max-sm:shrink-0 phone:max-sm:whitespace-nowrap">
              <span class="svg-icon size-4 shrink-0 icon-date bg-stone-400"
                    aria-hidden="true"></span>
              <dt class="sr-only">Date</dt>
              <dd id="group-check-in-event-date" class="min-w-0">
              </dd>
            </div>
            <div class="flex min-w-0 items-center gap-2">
              <span class="svg-icon size-4 shrink-0 icon-location bg-stone-400"
                    aria-hidden="true"></span>
              <dt class="sr-only">Location</dt>
              <dd id="group-check-in-event-location" class="min-w-0 truncate">
              </dd>
            </div>
          </dl>
        </div>

        <div class="relative aspect-[4/3] overflow-hidden border-t border-stone-200 bg-stone-950 phone:max-sm:aspect-auto phone:max-sm:min-h-48 phone:max-sm:flex-1">
          <video data-group-check-in-video
                 class="size-full object-cover phone:max-sm:absolute phone:max-sm:inset-0"
                 playsinline
                 muted>
          </video>
          <div class="pointer-events-none absolute inset-[10%] rounded-2xl border-2 border-white/70 phone:max-sm:inset-auto phone:max-sm:top-1/2 phone:max-sm:left-1/2 phone:max-sm:aspect-square phone:max-sm:w-[70%] phone:max-sm:max-h-[80%] phone:max-sm:-translate-x-1/2 phone:max-sm:-translate-y-1/2">
            <div data-group-check-in-camera-unavailable
                 class="absolute inset-0 hidden items-center justify-center px-4 text-center text-stone-300">
              <div>
                <span class="relative inline-flex" aria-hidden="true">
                  <span class="svg-icon size-10 icon-recording bg-stone-500"></span>
                  <span class="absolute left-1/2 top-1/2 h-0.5 w-12 -translate-x-1/2 -translate-y-1/2 rotate-45 bg-stone-400">
                  </span>
                </span>
                <p class="mt-4 text-sm sm:text-base"
                   data-group-check-in-camera-unavailable-message></p>
              </div>
            </div>
          </div>
          <div data-group-check-in-result
               class="absolute inset-x-4 top-4 hidden rounded-lg p-4 text-center shadow-lg"
               aria-live="polite"></div>
        </div>
      </div>

      <div class="mt-4 flex items-center gap-2 rounded-md border border-stone-200 bg-stone-50 px-3 py-2.5 text-sm text-stone-600 phone:max-sm:mx-4 phone:max-sm:mt-3">
        <span class="size-2 shrink-0 rounded-full bg-stone-400" aria-hidden="true"></span>
        <div id="group-check-in-scanner-status"
             data-group-check-in-status
             role="status">Starting camera...</div>
      </div>

      <div class="mt-5 grid gap-4 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-end phone:max-sm:mx-4 phone:max-sm:my-3 phone:max-sm:gap-3">
        <div class="min-w-0 phone:has-[option:only-child]:max-sm:hidden">
          <label for="group-check-in-camera" class="form-label">Camera</label>
          <select id="group-check-in-camera"
                  data-group-check-in-camera
                  class="select select-primary mt-1 phone:min-h-11"
                  disabled>
            <option>Finding cameras...</option>
          </select>
        </div>

        <div class="flex flex-wrap items-center gap-4 sm:pb-1">
          <label class="inline-flex cursor-pointer items-center has-[:disabled]:cursor-not-allowed phone:min-h-11">
            <input type="checkbox" class="sr-only peer" data-group-check-in-mute>
            <span class="toggle-track"></span>
            <span class="ms-3 text-sm font-medium text-stone-900"
                  data-group-check-in-mute-label>Mute sounds</span>
          </label>
          <label class="hidden cursor-pointer items-center has-[:disabled]:cursor-not-allowed phone:min-h-11"
                 data-group-check-in-torch-control>
            <input type="checkbox"
                   class="sr-only peer"
                   data-group-check-in-torch
                   disabled>
            <span class="toggle-track"></span>
            <span class="ms-3 text-sm font-medium text-stone-900">Torch</span>
          </label>
        </div>
      </div>
    </div>

    <footer class="flex shrink-0 justify-end border-t border-stone-200 p-4 md:p-5 sheet-foot">
      <button type="button"
              class="btn-primary-outline w-full sm:w-auto"
              data-group-check-in-close>Close</button>
    </footer>
  </div>
</div>
