[advisories]
ignore = [
    # `minify-html` currently pulls `bincode 2.0.1` through the `oxc` toolchain.
    # This is an unmaintained warning, not an active vulnerability, and there is
    # no semver-compatible lockfile-only update available from this workspace.
    "RUSTSEC-2025-0141",

    # `openidconnect` currently depends on `rsa 0.9.10`, and RustSec does not
    # list a fixed release for this Marvin timing-sidechannel advisory yet.
    # Keep this ignored until the upstream OIDC stack can move off this branch.
    "RUSTSEC-2023-0071",

    # `parcel_sourcemap` (via `minify-html`/`lightningcss`) pins `rkyv 0.7.x`,
    # and RustSec lists no fixed 0.7 release (fix requires 0.8.17). The
    # vulnerable Rc/Arc code path is behind the `rc` feature, which this
    # workspace does not enable, and the archives are build-time source maps,
    # not untrusted input. Revisit when upstream moves to rkyv 0.8.
    "RUSTSEC-2026-0235",

    # `crypto-bigint 0.5.5` is pulled by `aws-sigv4` (`sigv4a`) and by the
    # `ssi` stack through `k256`/`elliptic-curve 0.13`. RustSec only lists a
    # fix in 0.7.6+, there is no patched 0.5.x release, and the latest
    # `aws-sigv4` still requires 0.5. The 0.7.x entry in Cargo.lock is already
    # on a fixed release. Revisit when upstream moves off crypto-bigint 0.5.
    "RUSTSEC-2026-0387",

    # `quinn-proto 0.11.15` is only recorded in Cargo.lock through a `reqwest`
    # weak dependency feature (`quinn?/...`). The `http3` feature is not
    # enabled, so quinn is never compiled into the workspace. Revisit if HTTP/3
    # support is enabled or the lockfile entry can be refreshed.
    "RUSTSEC-2026-0338",
    "RUSTSEC-2026-0339",
    "RUSTSEC-2026-0340",
    "RUSTSEC-2026-0341",
    "RUSTSEC-2026-0342",
]
